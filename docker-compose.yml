# Orquestracao da suite de testes do TaskAnalyzer (Bootcamp III, Fase 3).
# Um unico comando constroi a imagem e dispara a suite no ambiente isolado:
#   docker compose run --rm tests
services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: sdd-task-analyzer:latest
    command: ["pytest", "tests/test_harness.py", "-v"]
